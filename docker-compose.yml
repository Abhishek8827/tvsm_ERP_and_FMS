# Local development services. NOT tested in the build sandbox (no Docker daemon there):
# run `docker compose up -d` on your machine and tell me if anything fails.
services:
  mongo:
    image: mongo:7
    # Single-node replica set: MongoDB transactions (receipt + ledger + counter) need one.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mongo-data:
